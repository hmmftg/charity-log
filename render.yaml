# Render Blueprint — optional if you prefer creating services from this repo.
# You can also configure an existing Render web service manually; see DEPLOY_RENDER_GITHUB_PAGES.md.

services:
  - type: web
    name: charity-log-api
    runtime: go
    rootDir: backend
    plan: free
    buildCommand: go build -o healthcare ./cmd/healthcare/ && go build -o paramEncryptor ./cmd/paramEncryptor/
    startCommand: ./scripts/render-start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: charity-log-db
          property: connectionString
      - key: PORT
        value: "10000"

databases:
  - name: charity-log-db
    plan: free
    databaseName: healthcare
    user: healthcare
